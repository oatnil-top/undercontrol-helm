# UnDercontrol Helm Chart Values

# -- Backend configuration
backend:
  enabled: true
  replicaCount: 1

  image:
    repository: docker.io/lintao0o0/undercontrol-backend
    tag: ""  # defaults to Chart appVersion
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Environment (production or development)
  environment: production

  # -- JWT configuration
  jwt:
    secret: ""  # REQUIRED: set a strong secret
    expirationMinutes: 60

  # -- Database configuration
  database:
    # -- Database type: sqlite or postgres
    type: sqlite
    # -- PostgreSQL connection settings (only used when type=postgres)
    postgres:
      host: ""
      port: 5432
      user: postgres
      password: ""
      database: undercontrol
      sslMode: disable

  # -- S3/R2 object storage (optional)
  s3:
    enabled: false
    endpoint: ""
    region: auto
    bucket: ""
    accessKeyId: ""
    secretAccessKey: ""
    forcePathStyle: true

  # -- Data path for local storage (SQLite DB + file uploads)
  dataPath: /data

  # -- Persistence for local storage (used with SQLite / local file uploads)
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  # -- CORS allowed origins
  corsAllowedOrigins: ""

  # -- Pro/Max license token (LICENSE_TOKEN)
  licenseToken: ""
  # -- Host secret the license token was issued for (LICENSE_HOST_SECRET).
  # A token without its matching host secret does not activate.
  licenseHostSecret: ""

  # -- Admin account created on first start (ADMIN_EMAIL / ADMIN_PASSWORD).
  # A server with a Pro or Max license refuses to start without admin.email.
  admin:
    email: ""
    password: ""

  # -- Let other people sign up (REGISTRATION_ENABLED). Default: only the admin can log in.
  registrationEnabled: false

  # -- Public URL users open the app at, e.g. https://ud.example.com (HOST_DOMAIN,
  # required by the server: it builds file download/upload URLs from it).
  # Empty: the first ingress host when ingress is enabled, otherwise
  # http://localhost:3000 (the port-forward printed after install).
  hostDomain: ""

  # -- Pod security context. fsGroup lets the non-root backend (uid 1000) write the PVC.
  podSecurityContext:
    fsGroup: 1000

  # -- Extra environment variables
  extraEnv: []
  # - name: OPENAI_API_KEY
  #   value: "sk-..."

  # -- Use an existing Secret for sensitive values
  # Keys: jwt-secret, postgres-password, s3-access-key-id, s3-secret-access-key,
  #       license-token, license-host-secret, admin-password
  existingSecret: ""

# -- Frontend configuration
frontend:
  enabled: true
  replicaCount: 1

  image:
    repository: docker.io/lintao0o0/undercontrol-vite-app
    tag: ""  # defaults to Chart appVersion
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # -- Upload size limit on the /api/v1 proxy (nginx client_max_body_size)
  clientMaxBodySize: 100m

  # -- Extra environment variables
  extraEnv: []

# -- Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  # -- Host-based routing
  hosts:
    - host: ud.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls: []
  #  - secretName: ud-tls
  #    hosts:
  #      - ud.example.com

# -- NodePort configuration (alternative to Ingress)
# Set backend.service.type and/or frontend.service.type to NodePort
# backend:
#   service:
#     type: NodePort
#     nodePort: 30880
# frontend:
#   service:
#     type: NodePort
#     nodePort: 30800

# -- Image pull secrets
imagePullSecrets: []

# -- Override chart name
nameOverride: ""
fullnameOverride: ""
