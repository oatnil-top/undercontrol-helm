{{- if .Values.frontend.enabled }}
# The image's own default.conf proxies /api/v1/ to "backend:8080" through
# Docker's embedded DNS (127.0.0.11), which does not exist in a pod. This
# replaces it with the backend Service of this release.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "undercontrol.frontend.fullname" . }}-nginx
  labels:
    {{- include "undercontrol.frontend.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size {{ .Values.frontend.clientMaxBodySize }};

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

        location /api/v1/ {
            proxy_pass http://{{ include "undercontrol.backend.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.backend.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        server_tokens off;
    }
{{- end }}
