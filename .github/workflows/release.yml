name: Release Charts

# push: a chart change on main releases it.
# schedule / workflow_dispatch: follow UnDercontrol releases. The UnDercontrol
# release pipeline does not touch this repo, so without this job the chart
# stays on whatever version was last bumped by hand (it sat at 0.65.2 for six
# months). A bump commit pushed with GITHUB_TOKEN does not trigger another
# workflow run, so the bump and the release happen in this one job.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: release-charts
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Follow the latest UnDercontrol release
        id: follow
        run: scripts/follow-release.sh

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/undercontrol

      - name: Run chart-releaser
        id: cr
        uses: helm/chart-releaser-action@v1.6.0
        with:
          # A template-only change keeps the current version until the next
          # UnDercontrol release bumps it; do not fail on the existing tag.
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Login to GHCR
        if: steps.cr.outputs.changed_charts != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to OCI registry
        if: steps.cr.outputs.changed_charts != ''
        run: |
          for chart in charts/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              helm package "$chart"
              helm push *.tgz oci://ghcr.io/${{ github.repository_owner }}
              rm -f *.tgz
            fi
          done
